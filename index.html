<html lang="hu" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#0f172a">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="og-image.png">

    <!-- Open Graph / közösségi megosztás -->
    <meta property="og:type" content="website">
    <meta property="og:locale" content="hu_HU">
    <meta property="og:site_name" content="Mátyás Király Utcai Általános Iskola versenycsapatok versenyei">
    <meta property="og:title" content="Mátyás Király Utcai Általános Iskola versenycsapatok versenyei">
    <meta property="og:description" content="Közös idővonal és teendők a Radnóti HACK &amp; CODE, a Neumann János Informatikai Verseny és az Árpád-kupa 2026/2027-es fordulóihoz.">
    <meta property="og:url" content="https://mathias-rex.github.io/2026-27-competitions/">
    <meta property="og:image" content="https://mathias-rex.github.io/2026-27-competitions/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Mátyás Király Utcai Általános Iskola versenycsapatok versenyei">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Mátyás Király Utcai Általános Iskola versenycsapatok versenyei">
    <meta name="twitter:description" content="Közös idővonal és teendők a Radnóti HACK &amp; CODE, a Neumann János Informatikai Verseny és az Árpád-kupa 2026/2027-es fordulóihoz.">
    <meta name="twitter:image" content="https://mathias-rex.github.io/2026-27-competitions/og-image.png">
    <title>Mátyás Király Utcai Általános Iskola versenycsapatok versenyei</title>
    <script>
        // Téma inicializálás renderelés előtt: localStorage → böngésző beállítás
        (function () {
            var theme = null;
            try { theme = localStorage.getItem('theme'); } catch (e) {}
            if (theme !== 'dark' && theme !== 'light') {
                theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-theme', theme);
            document.documentElement.style.colorScheme = theme;
        })();
    </script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- createDOMBlocks (helyi build: vendor/, frissítés: node scripts/sync-domblocks.mjs) és az oldal témája -->
    <link rel="stylesheet" href="vendor/createDOMBlocks.css">
    <link rel="stylesheet" href="css/theme.css">
</head>
<body class="cmp-page">
    <div id="app"></div>

    <!--
      AZ OLDAL SZERKEZETE (createDOMBlocks YAML leíró)

      Olvasási útmutató
      - Kisbetűs név (header, div, span, a ...) = nyers HTML elem, nagybetűs (Card, Button, Gantt ...) = könyvtári komponens.
      - A "Típus#azonosító.osztály" kulcs a csomópont neve; az érték a paraméterei vagy a gyerekei.
      - ${...} kifejezés: az állapotból (state) vagy az adatokból (data) olvas, az állapot változásakor magától frissül.
      - "@név": eseménykezelő a js/app.js `handlers` térképéből.  $név: a js/app.js `data` objektumának eleme.

      Az állapot (state) elemei
        Forrás (a felhasználó műveletei írják):
          menuOpen        a mobil menü nyitva van-e
          detailsOpen     a versenykiírások szekció nyitva van-e
          timeFilter      "all" vagy "upcoming" (az időrendi lista szűrője)
          selectedId      a kiválasztott esemény azonosítója
          theme           "light" vagy "dark"
          active          { versenyAzonosító: igaz/hamis }, a versenykapcsolók állása
        Származtatott (js/derive.js számolja a fentiekből, ezeket csak olvassuk):
          themeLabel, todayInRange, competitions[], timelineRows[], events[], listSubtitle,
          selectedEvent, competitionInfos[], noEvents, noCompetitionInfo, whatsNew
      Az adatok (data): icons, downloads[], timelineSettings, todayFull, todayLegend.
    -->
    <script type="text/yaml" id="page">
# yaml-language-server: $schema=vendor/createDOMBlocks.schema.json

# ---------------------------------------------------------------------------
# Saját részletek
# ---------------------------------------------------------------------------
define:

  # Ikon és szöveg egymás mellett: az ikon külön elemben, a szöveg nem törik alá
  IconText:
    params: [icon, text]
    body:
      - span.cmp-icontext:
          - span.cmp-icontext-icon:
              text: "${icon}"
              aria-hidden: "true"
          - span.cmp-icontext-text: "${text}"

  # Letölthető dokumentumok listája (workshop dokumentumok): cím, leírás, méret, megnézés és letöltés gomb
  DocumentList:
    params: [documents]
    body:
      - div.cmp-doclist:
          - each:
              in: "${documents}"
              as: file
              key: file.href
            do:
              - div.cmp-doc:
                  - div:
                      style: "min-width:0"
                      children:
                        - span.cmp-doc-title: "${file.title}"
                        - span.cmp-doc-desc: "${file.description}"
                        - span.cmp-doc-size: "${file.sizeText}"
                  - div.cmp-doc-actions:
                      - a.link.cmp-icon-btn:
                          href: "${file.href}"
                          target: _blank
                          rel: "noopener noreferrer"
                          title: "Megnézés"
                          aria-label: "Megnézés: ${file.title}"
                          html: $icons.eye
                      - a.link.cmp-icon-btn:
                          href: "${file.href}"
                          download: ""
                          title: "Letöltés"
                          aria-label: "Letöltés: ${file.title}"
                          html: $icons.download

  # Egy esemény részletei: az oldalsó panelben és a felugró ablakban is ez jelenik meg.
  EventDetails:
    params: [event]
    body:
      - if: "${event}"
        then:
          - div.cmp-detail:
              style: "${event.colorStyle}"
              children:

                # Fejléc: balra az érintett csapat(ok) logója, mellette a verseny neve és az esemény címe
                - div.cmp-detail-head:
                    - div.cmp-detail-logos:
                        - each:
                            in: "${event.teamLogos}"
                            as: team
                            key: team.name
                          do:
                            - img.cmp-logo:
                                src: "${team.logo}"
                                alt: "${team.alt}"
                                title: "${team.name}"
                                width: 56
                                height: 56
                    - div:
                        style: "min-width:0"
                        children:
                          - Badge.cmp-tag.is-lg: "${event.competitionName}"
                          - Title(4).cmp-detail-title: "${event.title}"

                # Időpont és helyszín
                - div.cmp-infobox:
                    - div.cmp-infobox-row:
                        - span: "Időpont:"
                        - span:
                            - span: "${event.date}"
                            - if: "${event.hasTime}"
                              then:
                                - br: null
                                - span: "${event.time}"
                    - div.cmp-infobox-row:
                        - span: "Helyszín / Forma:"
                        - span: "${event.location}"

                # Figyelmeztetések
                - if: "${event.isEndEstimated}"
                  then:
                    - Paragraph.cmp-note: "⏱ A befejezés időpontja nem ismert, a naptárban 1,5 órás becslés szerepel."
                - if: "${event.hasDiscrepancy}"
                  then:
                    - span.badge.cmp-tag.is-warn:
                        text: "⚠ Eltérés a korábbi információtól"
                        title: "${event.discrepancyNote}"
                        tabindex: 0
                        style: "width:fit-content"

                # Leírás
                - div:
                    - Title(5).cmp-label: "Teendő és tudnivalók"
                    - Paragraph.cmp-text: "${event.description}"

                # Letölthető dokumentumok (pl. workshop kézikönyv, otthoni felkészülés, szülői nyilatkozat)
                - if: "${event.hasDocuments}"
                  then:
                    - div:
                        - Title(5).cmp-label: "Dokumentumok"
                        - DocumentList:
                            documents: "${event.documents}"

                # Gombok: hivatkozás és naptár
                - if: "${event.hasLink}"
                  then:
                    - a.link.cmp-cta.is-solid:
                        href: "${event.linkUrl}"
                        target: _blank
                        rel: "noopener noreferrer"
                        text: "${event.linkLabel}"
                        children:
                          - span.cmp-ext: { html: $icons.external }
                - if: "${event.canAddToCalendar}"
                  then:
                    - button.btn.cmp-cta:
                        text: "📅 Naptárba"
                        data-event-id: "${event.id}"
                        click: "@openCalendarMenu"


# ---------------------------------------------------------------------------
# Az oldal
# ---------------------------------------------------------------------------
ui:

  # ===== Fejléc: márka, mai nap, téma váltó, mobil menü =====
  - header.cmp-header:
      - div.cmp-header-inner:

          - div.cmp-brand:
              - span.cmp-brand-icon:
                  html: $icons.calendar
              - div:
                  style: "min-width:0"
                  children:
                    - Title(1)#page-title.cmp-title: "Mátyás Király Utcai Általános Iskola versenycsapatok versenyei"
                    - Paragraph.cmp-subtitle: "2026. november – 2027. április"

          # Hamburger gomb (csak mobilon látszik)
          - button#menu-toggle-button.btn.cmp-menu-btn:
              aria-controls: header-controls
              aria-expanded: "${menuOpen ? 'true' : 'false'}"
              aria-label: "${menuOpen ? 'Menü bezárása' : 'Menü megnyitása'}"
              html: "${menuOpen ? icons.close : icons.menu}"
              click:
                toggle: menuOpen

          - div#header-controls.cmp-controls:
              class: "${menuOpen ? 'is-open' : ''}"
              children:
                - Badge#today-badge.cmp-today-badge: "Mai nap: ${todayFull}"
                - Button#theme-toggle-button.cmp-theme-btn:
                    text: "${themeLabel}"
                    click: "@toggleTheme"

  - main.cmp-main:

      # ===== 1. Versenykapcsolók: kattintásra be- és kikapcsolják a versenyt =====
      - section#competition-filters.cmp-filters:
          aria-label: "Versenyek szűrése"
          children:
            - each:
                in: "${competitions}"
                as: competition
                key: competition.id
              do:
                - div:
                    style: "${competition.colorStyle}"
                    data-competition-id: "${competition.id}"
                    click: "@competitionCardClick"
                    children:
                      - Card#competition-card-${competition.id}:
                          class: "${competition.cssClass}"
                          title: "${competition.name}"
                          body:
                            - Paragraph: "${competition.targetGroup}"
                            - Checkbox#competition-switch-${competition.id}:
                                labelText: "${competition.name} ki/bekapcsolása"
                                checked: "${competition.active}"
                                onChange: "@competitionSwitchChanged"
                          footer:
                            - span.cmp-filter-org:
                                title: "${competition.organizer}"
                                children:
                                  - IconText:
                                      icon: "📍"
                                      text: "${competition.organizer}"
                            - span.cmp-filter-count: "${competition.upcomingText}"

      # ===== 2. Közös idővonal (Gantt) =====
      - section.cmp-panel:
          - div.cmp-panel-head:
              - div:
                  - Title(2).cmp-h2: "Közös időtengely és mérföldkövek"
                  - Paragraph.cmp-hint: "Kattints bármelyik pontra a részletes teendők megtekintéséhez!"
              - div.cmp-legend:
                  - span.cmp-legend-item:
                      - span.cmp-legend-dot: null
                      - span: "Forduló / Határidő"
                  - span.cmp-legend-item.is-final:
                      - span.cmp-legend-diamond: null
                      - span: "Döntő"
                  - span.cmp-legend-item.is-today:
                      hidden: "${!todayInRange}"
                      children:
                        - span.cmp-legend-line: null
                        - span: "${todayLegend}"

          - Gantt#timeline:
              rows: "${timelineRows}"
              from: "2026-11"
              to: "2027-04"
              axis: months
              monthWidth: $timelineSettings.monthWidth
              labelWidth: $timelineSettings.labelWidth
              today: $timelineSettings.today
              todayLabel: $timelineSettings.todayLabel
              barStyle: thin
              dimPast: true
              selectable: false
              dragScroll: true
              labelHeader: "Verseny"
              ariaLabel: "Versenyek közös idővonala"
              emptyText: "Nincs kiválasztott verseny. Kapcsold be legalább az egyik versenyt a fenti kártyákon az idővonal megjelenítéséhez!"
              selectedMilestoneId: "${selectedId}"
              onMilestoneHover: "@hoverEvent"
              onMilestoneClick: "@openEvent"

      # ===== 3. Kiválasztott esemény (bal) és időrendi lista (jobb) =====
      - div.cmp-split:

          # --- Bal oldal: a kiválasztott esemény részletei ---
          - aside.cmp-panel.cmp-aside:
              - div.cmp-aside-head:
                  - Title(3).cmp-aside-title: "Kiválasztott esemény"
                  - Badge#selected-event-status:
                      text: "${selectedEvent ? selectedEvent.statusText : 'Részletek'}"
                      class: "${selectedEvent ? selectedEvent.statusClass : 'badge cmp-pill'}"
              - div#selected-event-panel:
                  - if: "${selectedEvent}"
                    then:
                      - EventDetails:
                          event: "${selectedEvent}"
                    else:
                      - Paragraph.cmp-hint: "Válassz ki egy eseményt az idővonalon vagy a listából!"

          # --- Jobb oldal: időrendi lista szűrővel ---
          - section.cmp-panel.cmp-list-panel:
              - div.cmp-list-head:
                  - div:
                      - Title(3).cmp-section-title: "Időrendi teendők és dátumok"
                      - Paragraph.cmp-hint: "${listSubtitle}"
                  - div.cmp-segment:
                      role: group
                      aria-label: "Időszűrő"
                      children:
                        - Button#time-filter-all:
                            text: "Összes"
                            class: "cmp-seg-btn ${timeFilter == 'all' ? 'is-active' : ''}"
                            click:
                              set:
                                timeFilter: all
                        - Button#time-filter-upcoming:
                            text: "Csak hátralévő"
                            class: "cmp-seg-btn ${timeFilter == 'upcoming' ? 'is-active' : ''}"
                            click:
                              set:
                                timeFilter: upcoming

              - div#event-list.cmp-list:
                  - if: "${noEvents}"
                    then:
                      - div.cmp-empty:
                          - strong: "Nincs megjeleníthető esemény a jelenlegi szűréssel."
                          - span: "Kapcsold be a versenyeket fent, vagy válts az „Összes” nézetre."

                  - each:
                      in: "${events}"
                      as: event
                      key: event.id
                    do:
                      - div:
                          class: "${event.cssClass}"
                          style: "${event.colorStyle}"
                          click:
                            set:
                              selectedId: "${event.id}"
                          children:

                            # Dátumdoboz, címkék, cím és leírás
                            - div.cmp-item-main:
                                - div:
                                    class: "${event.dateBoxClass}"
                                    children:
                                      - span.d: "${event.date}"
                                      - if: "${event.hasTime}"
                                        then:
                                          - span.t: "${event.time}"
                                      - span.y: "${event.year}"
                                - div.cmp-item-body:
                                    - div.cmp-tags:
                                        - span.badge.cmp-tag: "${event.competitionName}"
                                        - if: "${event.isFinal}"
                                          then:
                                            - span.badge.cmp-tag.is-final: "🏆 DÖNTŐ"
                                        - if: "${event.hasDiscrepancy}"
                                          then:
                                            - span.badge.cmp-tag.is-warn:
                                                text: "⚠ Eltérés a korábbi információtól"
                                                title: "${event.discrepancyNote}"
                                    - Title(4).cmp-item-title: "${event.title}"
                                    - Paragraph.cmp-item-desc: "${event.description}"

                            # Jobb oldali oszlop: állapot, helyszín, hivatkozás, naptár
                            - div.cmp-item-side:
                                - span:
                                    class: "${event.statusClass}"
                                    text: "${event.statusText}"
                                - div.cmp-item-side-right:
                                    - span.cmp-loc:
                                        - IconText:
                                            icon: "📍"
                                            text: "${event.location}"
                                    - div.cmp-item-links:
                                        - if: "${event.hasLink}"
                                          then:
                                            - a.link.cmp-mini:
                                                href: "${event.linkUrl}"
                                                target: _blank
                                                rel: "noopener noreferrer"
                                                click: "@stopPropagation"
                                                children:
                                                  - span.cmp-emoji: "🔗 "
                                                  - span: "${event.linkLabel}"
                                        - if: "${event.canAddToCalendar}"
                                          then:
                                            - button.btn.cmp-mini:
                                                data-event-id: "${event.id}"
                                                click: "@openCalendarMenu"
                                                children:
                                                  - span.cmp-emoji: "📅 "
                                                  - span: "Naptárba"

      # ===== 4. Versenykiírások (összecsukható) =====
      - section.cmp-panel:
          aria-label: "Versenykiírások, Feltételek és Linkek"
          children:
            - div.cmp-panel-head:
                - div:
                    - Title(2).cmp-h2.cmp-h2-lg: "Versenykiírások, Feltételek és Linkek"
                    - Paragraph.cmp-hint: "A bekapcsolt versenyek részletes kiírása, kategóriái, díjazása és hivatalos elérhetőségei"
                - Button#details-toggle-button:
                    text: "${detailsOpen ? 'Részletek elrejtése' : 'Részletek megjelenítése'}"
                    class: "cmp-toggle-btn ${detailsOpen ? '' : 'is-closed'}"
                    click:
                      toggle: detailsOpen

            - div#competition-infos.cmp-info-grid:
                hidden: "${!detailsOpen}"
                children:
                  - if: "${noCompetitionInfo}"
                    then:
                      - div.cmp-empty:
                          - strong: "Nincs megjeleníthető versenykiírás."
                          - span: "Kapcsold be a versenyeket az oldal tetején a részletes kiírások megtekintéséhez!"

                  - each:
                      in: "${competitionInfos}"
                      as: info
                      key: info.id
                    do:
                      - div:
                          style: "${info.colorStyle}"
                          children:
                            - Card.cmp-info:
                                body:

                                  # Színes fejléc: verseny, szervező, cím
                                  - div.cmp-info-head:
                                      - span.cmp-info-kicker: "${info.competitionName}"
                                      - Title(3): "${info.name}"
                                      - div.cmp-info-meta:
                                          - IconText:
                                              icon: "🏛️"
                                              text: "${info.organizer}"
                                      - div.cmp-info-meta:
                                          - IconText:
                                              icon: "📍"
                                              text: "${info.address}"

                                  # Tartalom: kiknek szól, csapataink, kategóriák / téma, fordulók, díjazás
                                  - div.cmp-info-content:
                                      - div:
                                          - Title(4).cmp-label: "Kiknek szól & feltételek"
                                          - Paragraph.cmp-block-text: "${info.participants}"

                                      - if: "${info.hasTeams}"
                                        then:
                                          - div.cmp-teams:
                                              - Title(4).cmp-label: "${info.teamsTitle}"
                                              - each:
                                                  in: "${info.teams}"
                                                  as: team
                                                  key: team.name
                                                do:
                                                  - div.cmp-team:
                                                      - if: "${team.logo}"
                                                        then:
                                                          - div.cmp-team-logo:
                                                              - img.cmp-logo.is-sm:
                                                                  src: "${team.logo}"
                                                                  alt: "${team.name} csapat logója"
                                                                  width: 40
                                                                  height: 40
                                                      - div.cmp-team-text:
                                                          - div.cmp-team-line:
                                                              - strong: "${team.name}"
                                                              - span.badge.cmp-tag: "${team.size}"
                                                          - div:
                                                              - span.badge.cmp-tag.is-neutral: "${team.grade}"

                                      - if: "${info.hasCategories}"
                                        then:
                                          - div:
                                              - Title(4).cmp-label: "6 versenykategória"
                                              - UnorderedList:
                                                  items: "${info.categories}"
                                                  class: "cmp-bullets is-plain"

                                      - if: "${info.hasTopic}"
                                        then:
                                          - div:
                                              - Title(4).cmp-label: "Téma és feladatok"
                                              - Paragraph.cmp-block-text: "${info.topic}"

                                      - div:
                                          - Title(4).cmp-label: "Fordulók és dátumok"
                                          - UnorderedList:
                                              items: "${info.rounds}"
                                              class: "cmp-bullets"

                                      - div:
                                          - Title(4).cmp-label: "Díjazás"
                                          - Paragraph.cmp-block-text: "${info.prizes}"

                                # Lábléc: hivatkozások és elérhetőségek
                                footer:
                                  - each:
                                      in: "${info.links}"
                                      as: link
                                      key: link.url
                                    do:
                                      - a:
                                          class: "link ${link.cssClass}"
                                          href: "${link.url}"
                                          target: _blank
                                          rel: "noopener noreferrer"
                                          text: "${link.icon} ${link.label}"
                                          children:
                                            - span.cmp-ext:
                                                html: $icons.external
                                  - Paragraph.cmp-contacts: "${info.contacts}"

      # ===== 5. Letölthető dokumentumok (js/downloads.js, a pdf-intake skill generálja) =====
      - section:
          aria-label: "Letölthető dokumentumok"
          children:
            - Title(2).cmp-h2: "Letölthető dokumentumok"
            - Paragraph.cmp-hint.cmp-mb-3: "A versenykiírások és szabályzatok eredeti PDF-jei versenyenként."
            - div.cmp-dl-grid:
                - each:
                    in: $downloads
                    as: group
                    key: group.id
                  do:
                    - div:
                        style: "${group.colorStyle}"
                        children:
                          - Card.cmp-dl:
                              title: "${group.name}"
                              body:
                                - each:
                                    in: "${group.documents}"
                                    as: file
                                    key: file.href
                                  do:
                                    - div.cmp-doc:
                                        - div:
                                            style: "min-width:0"
                                            children:
                                              - span.cmp-doc-title: "${file.title}"
                                              - if: "${file.description}"
                                                then:
                                                  - span.cmp-doc-desc: "${file.description}"
                                              - span.cmp-doc-size: "PDF, ${file.sizeKb} KB"
                                        - div.cmp-doc-actions:
                                            - a.link.cmp-icon-btn:
                                                href: "${file.href}"
                                                target: _blank
                                                rel: "noopener noreferrer"
                                                title: "Megnézés"
                                                aria-label: "Megnézés: ${file.title}"
                                                html: $icons.eye
                                            - a.link.cmp-icon-btn:
                                                href: "${file.href}"
                                                download: ""
                                                title: "Letöltés"
                                                aria-label: "Letöltés: ${file.title}"
                                                html: $icons.download

      # ===== 6. Workshop projektek (js/data.js WORKSHOP_PROJECTS) =====
      - section:
          aria-label: "Workshop projektek"
          children:
            - Title(2).cmp-h2: "Workshop projektek"
            - Paragraph.cmp-hint.cmp-mb-3: "Mit készítenek a csapatok a pályamunka workshopon, és melyik dokumentumok tartoznak hozzá."
            - div.cmp-project-grid:
                - each:
                    in: $workshopProjects
                    as: project
                    key: project.id
                  do:
                    - div:
                        style: "${project.colorStyle}"
                        children:
                          - Card.cmp-dl.cmp-project:
                              body:
                                - div.cmp-project-head:
                                    - img.cmp-logo:
                                        src: "${project.logo}"
                                        alt: "${project.team} csapat logója"
                                        width: 56
                                        height: 56
                                    - div:
                                        style: "min-width:0"
                                        children:
                                          - Title(3).cmp-project-title: "${project.title}"
                                          - div.cmp-project-team:
                                              - Badge.cmp-tag.is-lg: "${project.team}"
                                              - span.cmp-hint: "${project.teamInfo}"
                                - Paragraph.cmp-text: "${project.summary}"
                                - p.cmp-hint:
                                    - span: "Workshop: "
                                    - button.btn.cmp-textlink:
                                        text: "${project.dateText}"
                                        data-event-id: "${project.eventId}"
                                        click: "@openProjectEvent"
                                # A dokumentumok doboza a kártya aljára igazodik
                                - div.cmp-project-docs:
                                    - Title(5).cmp-label: "Letölthető dokumentumok"
                                    - DocumentList:
                                        documents: "${project.documents}"

  # ===== Lábléc =====
  - footer.cmp-footer: "Összesített verseny-idővonal • Radnóti HACK & CODE • Neumann János Informatikai Verseny • Árpád-kupa"

  # ===== Felugró ablakok =====

  # Az idővonalon rákattintott esemény részletei
  - Modal#event-modal:
      title: "Kiválasztott esemény"
      width: 448
      footer: false
      closeOnBackdrop: true
      closeOnEscape: true
      body:
        - EventDetails:
            event: "${selectedEvent}"

  # Újdonságok: a látogató által még nem látott változások
  - Modal#whats-new-modal:
      title: "Újdonságok az oldalon"
      width: 512
      footer: false
      closeOnBackdrop: true
      closeOnEscape: true
      body:
        - Paragraph.cmp-whatsnew-sub: "Ezek változtak legutóbbi látogatásod óta. Verzió ${whatsNew.version}"
        - each:
            in: "${whatsNew.entries}"
            as: entry
            key: entry.version
          do:
            - section.cmp-whatsnew-group:
                - if: "${whatsNew.hasMultipleEntries}"
                  then:
                    - h3.cmp-whatsnew-ver: "${entry.version} · ${entry.date}"
                - UnorderedList:
                    items: "${entry.items}"
                    class: "cmp-whatsnew-list"
        - div.cmp-whatsnew-actions:
            - Button#whats-new-ok-button:
                text: "Rendben, értem"
                class: cmp-primary
                click: "@acceptWhatsNew"
    </script>

    <script src="vendor/createDOMBlocks.js"></script>
    <script src="js/data.js"></script>
    <script src="js/downloads.js"></script>
    <script src="js/changelog.js"></script>
    <script src="js/helpers.js"></script>
    <script src="js/calendar.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/calendar-menu.js"></script>
    <script src="js/derive.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
